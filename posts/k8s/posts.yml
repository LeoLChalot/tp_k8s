apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-clusterip-dpl
  labels:
    app: posts-clusterip
spec:
  replicas: 2
  selector:
    matchLabels:
      app: posts-clusterip
  template:
    metadata:
      labels:
        app: posts-clusterip
    spec:
      containers:
        - name: posts-clusterip
          image: posts-clusterip-srv:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: APP_PORT
              value: "4000"
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: posts-clusterip-srv
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
  selector:
    app: posts-clusterip