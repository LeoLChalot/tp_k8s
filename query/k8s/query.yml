apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-dpl
  labels:
    app: query
spec:
  replicas: 2
  selector:
    matchLabels:
      app: query
  template:
    metadata:
      labels:
        app: query
    spec:
      containers:
      - name: query
        image: leolchalot/query-srv:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        env:
          - name: APP_PORT
            value: "4002"
        ports:
        - containerPort: 4002
---
apiVersion: v1
kind: Service
metadata:
  name: query-srv
spec:
  type: ClusterIP
  ports:
  - port: 4002
    targetPort: 4002
  selector:
    app: query