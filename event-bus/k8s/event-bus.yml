apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-bus-dpl
  labels:
    app: event-bus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-bus
  template:
    metadata:
      labels:
        app: event-bus
    spec:
      containers:
        - name: event-bus
          image: leolchalot/event-bus-srv:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - name: APP_PORT
              value: "4005"
          ports:
          - containerPort: 4005
---
apiVersion: v1
kind: Service
metadata:
  name: event-bus-srv
spec:
  type: ClusterIP
  ports:
  - port: 4005
    targetPort: 4005
  selector:
    app: event-bus