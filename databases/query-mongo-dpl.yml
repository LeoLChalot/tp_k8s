apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-mongo-dpl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query-mongo
  template:
    metadata:
      labels:
        app: query-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:latest
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: query-mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: query-mongo-srv
spec:
  selector:
    app: query-mongo
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017