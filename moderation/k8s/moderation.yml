apiVersion: apps/v1
kind: Deployment
metadata:
  name: moderation-dpl
  labels:
    app: moderation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moderation
  template:
    metadata:
      labels:
        app: moderation
  spec:
    containers:
    - name: moderation
    image: moderation-srv:latest
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    env:
      - name: APP_PORT
        value: "4003"
    ports:
    - containerPort: 4003
---
apiVersion: v1
kind: Service
metadata:
  name: moderation-srv
spec:
  type: ClusterIP
  ports:
  - port: 4003
    targetPort: 4003
  selector:
    app: moderation